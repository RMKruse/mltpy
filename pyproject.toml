[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymlt"
version = "0.4.0"
description = "Conditional Transformation Models — Python port of R mlt"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "René-Marcel Kruse", email = "rene.marcel.kruse@protonmail.com"},
]
keywords = ["transformation model", "survival analysis", "censoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/RMKruse/pymlt"
Documentation = "https://rmkruse.github.io/pymlt/"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
plots = ["matplotlib>=3.5"]
examples = [
    "matplotlib>=3.5",
    "pandas>=2.0",
    "lifelines>=0.28",
    "ipykernel>=6.0",
    "jupyter>=1.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints>=1.24",
    "pydata-sphinx-theme>=0.15",
    "nbsphinx>=0.9",
    "myst-parser>=2.0",
    "matplotlib>=3.5",
    "pandas>=2.0",
    "lifelines>=0.28",
    "ipykernel>=6.0",
    "jupyter>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "twine>=5.0",
    "build>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pymlt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pymlt.model.ConvergenceWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["pymlt"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 70
