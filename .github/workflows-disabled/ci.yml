name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & type-check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install .[dev]

      - name: ruff check
        run: ruff check pymlt/ tests/

      - name: mypy
        run: mypy pymlt/ --strict

  # ---------------------------------------------------------------------------
  # Job 2: Test matrix
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e .[dev,plots,pandas]

      - name: Run tests with coverage
        run: >
          pytest tests/ -v --tb=short
          --cov=pymlt
          --cov-report=term-missing
          --cov-fail-under=70

  # ---------------------------------------------------------------------------
  # Job 3: Validate against R reference data
  # ---------------------------------------------------------------------------
  validate:
    name: Validate against R references
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install .[dev]

      - name: Run validation
        run: python validation/run_validation.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation/results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 4a: Build docs (runs on every push / PR — catches Sphinx breakage early)
  # ---------------------------------------------------------------------------
  docs-build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install package and docs dependencies
        run: python -m pip install -e .[docs]

      - name: Build Sphinx docs
        run: sphinx-build -b html -W --keep-going docs/ docs/_build/html

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # ---------------------------------------------------------------------------
  # Job 4b: Deploy docs to GitHub Pages (main branch only)
  # ---------------------------------------------------------------------------
  docs-deploy:
    name: Deploy docs
    needs: [docs-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
